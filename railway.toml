[build]
builder = "NIXPACKS"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# ──────────────────────────────────────────────────────────────
# Service-specific start commands
# Railway picks the right block based on the service name.
# ──────────────────────────────────────────────────────────────

[services.web]
startCommand = "uvicorn execution.api_server:app --host 0.0.0.0 --port $PORT"

[services.feed]
startCommand = "python -m data_feed.angel_ws_equities"

[services.options]
startCommand = "python -m data_feed.angel_ws_options"

[services.cruncher]
startCommand = "python -m math_engine.candle_builder"

[services.brain]
startCommand = "python -m strategy_brain.brain"
